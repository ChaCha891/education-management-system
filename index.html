    .patrol-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.patrol-dropzone{border:2px dashed var(--line);border-radius:14px;background:#f8fafc;padding:14px;min-height:74px;align-items:center;justify-content:center;cursor:pointer}.patrol-dropzone.dragover{border-color:var(--primary);background:#eff6ff}.patrol-thumb{width:86px;height:66px;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#f8fafc}

    .worklog-display{min-height:120px;flex:1;line-height:1.45;font-size:13px;text-align:left;white-space:normal;word-break:break-word;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;color:#374151}
    .worklog-card-actions{padding:8px 10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:#fbfdff}
    .worklog-mobile-date{display:none}
    .shift-select-modal{width:min(820px,100%)}
    .shift-type-picker{display:flex;gap:8px;margin:10px 0 12px}
    .shift-type-picker button{flex:1;border:2px solid transparent}

    .shift-mini-day.empty{border:0;background:transparent;cursor:default}

    .shift-mini-day.shift-selected-night{background:#ede9fe;border-color:#7c3aed;color:#4c1d95}
    .shift-mini-tag{font-size:11px;font-weight:900}
    .memo-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

    .memo-file-title:hover{text-decoration:underline}

    .memo-editor textarea{min-height:320px}
    .work-schedule-list{display:grid;gap:10px}
    .work-schedule-item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;text-align:left}
    .work-event-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;border:1px solid rgba(0,0,0,.15)}
    .work-event-line{display:block;position:relative;margin:3px -10px 3px -10px;padding:4px 8px;font-size:12px;font-weight:900;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:23px;line-height:15px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
    .work-event-line.single{border-radius:8px;margin-left:0;margin-right:0}
    .work-event-line.start{border-radius:8px 0 0 8px;margin-left:0}
    .work-event-line.mid{border-radius:0}
    .work-event-line.end{border-radius:0 8px 8px 0;margin-right:0}
    @page{size:A4 landscape;margin:8mm}@media print{.patrol-report-scroll{overflow:visible!important;max-height:none!important;border:0!important;padding:0!important}body{background:#fff!important}body *{visibility:hidden!important}.no-print{display:none!important}#patrol-print-area,#patrol-print-area *{visibility:visible!important}#patrol-print-area{position:absolute;left:0;top:0;width:100%;padding:0;margin:0;page-break-inside:avoid}.patrol-report-table th,.patrol-report-table td{border:1px solid #000!important}.patrol-photo-cell,.patrol-empty-cell,.patrol-cell-wrap,.patrol-empty-box{height:170px!important}.card{box-shadow:none!important;border:0!important;padding:0!important;margin:0!important}}
    @media(max-width:760px){
      .header{align-items:center;flex-wrap:nowrap;padding:10px 12px}
      .header h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      .nav{position:fixed;top:0;right:-82%;width:82%;max-width:320px;height:100vh;background:#fff;z-index:60;display:flex;flex-direction:column;gap:8px;padding:18px 14px;border-left:1px solid var(--line);box-shadow:-8px 0 22px rgba(31,41,55,.18);transition:right .22s ease;overflow:auto}

    .equipment-number-btn{background:#fff;border:1px solid var(--line);color:var(--primary);padding:8px 12px;border-radius:10px;font-weight:900}

<body>
  <div class="header">

<script>
// =========================
// 1) 여기에 Supabase 값을 넣으세요.
// =========================

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function onlyDigits(v){ return String(v || "").replace(/\D/g, ""); }
function autoHyphenDate(v){
  const d = onlyDigits(v).slice(0,8);
  if(d.length <= 4) return d;
  if(d.length <= 6) return `${d.slice(0,4)}-${d.slice(4)}`;
  return `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
}
function autoHyphenPhone(v){
  const d = onlyDigits(v).slice(0,11);
  if(d.startsWith("02")){
    if(d.length <= 2) return d;
    if(d.length <= 5) return `${d.slice(0,2)}-${d.slice(2)}`;
    if(d.length <= 9) return `${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;
    return `${d.slice(0,2)}-${d.slice(2,6)}-${d.slice(6)}`;
  }
  if(d.length <= 3) return d;
  if(d.length <= 7) return `${d.slice(0,3)}-${d.slice(3)}`;
  return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
}
function isValidDateText(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v || "")) return false;
  const [y,m,d] = v.split("-").map(Number);
  const date = new Date(`${v}T00:00:00`);
  return date.getFullYear()===y && date.getMonth()+1===m && date.getDate()===d;
}
function dateVal(id){ return autoHyphenDate(val(id)); }
function phoneVal(id){ return autoHyphenPhone(val(id)); }
function applyKoreanInputDefaults(){
  document.querySelectorAll("input, textarea").forEach(el => {
    if(el.type === "hidden" || el.type === "file" || el.type === "checkbox" || el.type === "radio") return;
    el.setAttribute("lang", "ko");
    el.setAttribute("autocomplete", "off");
    el.setAttribute("autocapitalize", "off");
    el.setAttribute("spellcheck", "false");
    if(!el.dataset.format && !["number", "tel", "date", "time"].includes(el.type || "")){
      el.setAttribute("inputmode", "text");
      el.style.imeMode = "active";
    }
  });
}
function bindAutoFormatInputs(){
  applyKoreanInputDefaults();
  document.querySelectorAll('input[data-format="date"]').forEach(el => {
    if(!el.value) el.value = todayStr();
    if(el.dataset.bound === "1") return;
    el.dataset.bound = "1";
    el.setAttribute("inputmode", "numeric");
    el.setAttribute("maxlength", "10");
    el.addEventListener("input", () => { el.value = autoHyphenDate(el.value); });
    el.addEventListener("blur", () => {
      el.value = autoHyphenDate(el.value);
      if(!el.value) el.value = todayStr();
    });
  });
  document.querySelectorAll('input[data-format="phone"]').forEach(el => {
    if(el.dataset.bound === "1") return;
    el.dataset.bound = "1";
    el.setAttribute("inputmode", "numeric");
    el.setAttribute("maxlength", "13");
    el.addEventListener("input", () => { el.value = autoHyphenPhone(el.value); });
    el.addEventListener("blur", () => { el.value = autoHyphenPhone(el.value); });
  });
}

function addDays(dateText, days) {
  const d = new Date(dateText + "T00:00:00");
  d.setDate(d.getDate() + Number(days));
  return d;
}
function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function remainDays(target) {
  const today = new Date(todayStr() + "T00:00:00");
  return Math.round((target - today) / (1000*60*60*24));
}
function ddayText(remain) {
  if (remain === null || remain === undefined || Number.isNaN(remain)) return "반복없음";
  if (remain < 0) return `D+${Math.abs(remain)}`;
  if (remain === 0) return "D-Day";
  return `D-${remain}`;
}
function isOneTimeCycle(cycleDays){ return Number(cycleDays) <= 0; }

function normalizeWorkDates(dates){
  return Array.from(new Set((dates || []).filter(isValidDateText))).sort();
}
function sameWeek(a,b){
  const da = new Date(a + "T00:00:00"), db = new Date(b + "T00:00:00");
  return da.getFullYear() === db.getFullYear() && da.getMonth() === db.getMonth() && Math.floor((da.getDate()+new Date(da.getFullYear(), da.getMonth(), 1).getDay()-1)/7) === Math.floor((db.getDate()+new Date(db.getFullYear(), db.getMonth(), 1).getDay()-1)/7);
}
function eventSegmentClass(ev, dateText){
  const prev = addDaysText(dateText, -1), next = addDaysText(dateText, 1);
  const hasPrev = ev.dates.includes(prev) && sameWeek(prev, dateText);
  const hasNext = ev.dates.includes(next) && sameWeek(dateText, next);
  if(hasPrev && hasNext) return "mid";
  if(!hasPrev && hasNext) return "start";
  if(hasPrev && !hasNext) return "end";
  return "single";
}
function workEventLineHtml(ev, dateText){

}

function addDaysText(dateText, days){ return formatDate(addDays(dateText, days)); }

function historyRecordKey(h){ return h?.id ? `history:${h.id}` : `history:${h.worker_id}:${h.education_name}:${h.education_date}`; }
function addYears(dateText, years){
  const d = new Date(dateText + "T00:00:00");
  d.setFullYear(d.getFullYear() + Number(years));
  return d;
}
function retentionStatus(h){
  const rule = getRetentionRule(h.education_name);
  if(!rule || !h.education_date || Number(rule.retention_years) <= 0) return {managed:false, expired:false, expiryText:"-", ack:false, years:"-"};
  const expiry = addYears(h.education_date, Number(rule.retention_years));
  const expired = remainDays(expiry) < 0;
  const key = historyRecordKey(h);
  const ack = retentionAckKeys().includes(key);
  return {managed:true, expired, expiryText:formatDate(expiry), ack, key, years:Number(rule.retention_years)};
}
function educationTypeNames(){ return activeEducationRules().map(r => r.education_name).filter(Boolean); }
function getEducationRule(name){ return activeEducationRules().find(r => r.education_name === name) || null; }
function educationMeta(name){ const r=getEducationRule(name); return r ? `${r.category || "구분없음"} · ${r.hours || "시간/조건 미입력"}` : "사용자 지정"; }
function calcSchedule(lastDate, cycleDays){
  if(!lastDate) return { nextText:"-", remain:null, dday:"-", cls:"gray", status:"미등록" };
  if(isOneTimeCycle(cycleDays)) return { nextText:"반복없음", remain:null, dday:"완료", cls:"info", status:"이수" };
  const nd=addDays(lastDate, cycleDays);
  const remain=remainDays(nd);
  const status=remain<0?"기한초과":remain<=14?"임박":"정상";
  return { nextText:formatDate(nd), remain, dday:ddayText(remain), cls:badgeClass(remain), status };
}
function badgeClass(remain) {
  if (remain === null || remain === undefined || Number.isNaN(remain)) return "info";
  if (remain < 0) return "due";
  if (remain <= 14) return "soon";
  return "ok";
}
function escapeHtml(v) {
  return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

    .replaceAll("{next_date}", item.next_date || "")

    .replaceAll("{phone}", item.phone || "");
}
function smsLink(item) {
  const phone = String(item.phone || "").replaceAll("-","").replaceAll(" ","");
  return `sms:${phone}?body=${encodeURIComponent(smsBody(item))}`;
}

  const dates = state.history
    .filter(h => Number(h.worker_id) === Number(workerId) && h.education_name === educationName)
    .map(h => h.education_date)
    .filter(Boolean)
    .sort()
    .reverse();
  return dates[0] || "";
}

function makeDue() {
  const result = [];
  const rules = activeEducationRules();
  for (const w of state.workers) {
    for (const r of rules) {
      const last = latestHistoryDate(w.id, r.education_name);
      const sch = calcSchedule(last, Number(r.cycle_days));
      if (sch.remain !== null && sch.remain <= 30) {
        result.push({
          worker_id:w.id,
          education_name:r.education_name,
          cycle_days:Number(r.cycle_days),
          name:w.name,
          phone:w.phone || "",
          company:w.company || "",
          last_date:last,
          next_date:sch.nextText,
          remain:sch.remain,
          dday:sch.dday,
          status:sch.status
        });
      }
    }
  }
  result.sort((a,b) => a.remain - b.remain || a.name.localeCompare(b.name, "ko"));
  state.due = result;
}

function dashboardStats(){
  let overdue=0, soon=0, normal=0, oneTime=0, missing=0;
  for(const w of state.workers){
    for(const r of activeEducationRules()){
      const last = latestHistoryDate(w.id, r.education_name);
      if(!last){ missing++; continue; }
      const sch=calcSchedule(last, Number(r.cycle_days));
      if(sch.remain===null) oneTime++;
      else if(sch.remain<0) overdue++;
      else if(sch.remain<=14) soon++;
      else normal++;
    }
  }
  return {overdue, soon, normal, oneTime, missing};
}

function normalizeSearchText(v){ return String(v || "").toLowerCase().replace(/\s+/g, "").trim(); }
function filterListRows(inputId, tbodyId){
  const input = document.getElementById(inputId);

  const q = normalizeSearchText(input.value);
  let visible = 0;
  tbody.querySelectorAll("tr[data-search]").forEach(row => {
    const text = normalizeSearchText(row.getAttribute("data-search"));
    const show = !q || text.includes(q);
    row.style.display = show ? "" : "none";

function openTempPhotoDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(TEMP_PHOTO_DB,1);
    req.onupgradeneeded=()=>{
      const dbx=req.result;
      if(!dbx.objectStoreNames.contains(TEMP_PHOTO_STORE)){
        const st=dbx.createObjectStore(TEMP_PHOTO_STORE,{keyPath:"id"});
        st.createIndex("date","date",{unique:false});
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function tempPhotoTx(mode, fn){
  const dbx=await openTempPhotoDb();
  return new Promise((resolve,reject)=>{
    const tx=dbx.transaction(TEMP_PHOTO_STORE,mode);
    const st=tx.objectStore(TEMP_PHOTO_STORE);
    let result;
    try{ result=fn(st); }catch(e){ dbx.close(); reject(e); return; }
    tx.oncomplete=()=>{dbx.close();resolve(result)};
    tx.onerror=()=>{dbx.close();reject(tx.error)};
  });
}
function revokeTempPhotoUrls(){ for(const u of tempPhotoUrls.values()) URL.revokeObjectURL(u); tempPhotoUrls.clear(); }
async function loadTempPhotos(){
  revokeTempPhotoUrls();
  const dbx=await openTempPhotoDb();
  const rows=await new Promise((resolve,reject)=>{
    const tx=dbx.transaction(TEMP_PHOTO_STORE,"readonly");
    const req=tx.objectStore(TEMP_PHOTO_STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error);
  });
  dbx.close();
  tempPhotos=rows.filter(x=>x.date===todayStr()).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  for(const x of tempPhotos) tempPhotoUrls.set(String(x.id),URL.createObjectURL(x.blob));

function readImageAsDataUrl(file, maxSize=1100, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일 읽기 실패"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("이미지 처리 실패"));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindPatrolDropPaste(){
  const zone = document.getElementById("patrol-dropzone");
  if(!zone || zone.dataset.bound === "1") return;
  zone.dataset.bound = "1";

  zone.addEventListener("dragover", e => {
    e.preventDefault();
    zone.classList.add("dragover");
  });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("dragover");
    addPatrolFiles(e.dataTransfer?.files || []);
  });

  if(!document.body.dataset.patrolPasteBound){
    document.body.dataset.patrolPasteBound = "1";
    document.addEventListener("paste", e => {
      if(currentPage !== "patrol") return;
      const files = [];
      if(e.clipboardData?.files?.length) {
        files.push(...Array.from(e.clipboardData.files));
      } else if(e.clipboardData?.items?.length) {
        for(const item of e.clipboardData.items){
          if(item.kind === "file"){
            const f = item.getAsFile();
            if(f) files.push(f);
          }
        }
      }
      if(files.length){
        e.preventDefault();
        addPatrolFiles(files);
      }
    });
  }
}

function downloadPatrolCsv(dateText){
  const rows = patrolRecordsByDate(dateText);
  if(!rows.length) return toast("내보낼 순회점검 데이터가 없습니다.");
  const header = ["점검일자","차량번호","기사님성함","작업장소","작업내용","사진수"];
  const escapeCsv = v => `"${String(v ?? "").replaceAll('"','""')}"`;
  const lines = [header.map(escapeCsv).join(",")];
  rows.forEach(r => lines.push([
    r.date,
    r.vehicle_number || "",
    r.worker_name || patrolWorkerText(r),
    r.place || "",
    r.work || "",
    ((r.images || []).length + (r.temp_image_ids || []).length)
  ].map(escapeCsv).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `순회점검_${dateText || todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function patrolDateDiffDays(fromDate, toDate=todayStr()){
  if(!isValidDateText(fromDate) || !isValidDateText(toDate)) return 999999;
  const a=new Date(fromDate+"T00:00:00");
  const b=new Date(toDate+"T00:00:00");
  return Math.floor((b-a)/86400000);
}
function latestPatrolRecordForEquipment(eq){
  const eqId=String(eq?.id||"");
  const vno=equipmentDisplayNo(eq);
  return patrolRecords()
    .filter(r => (eqId && String(r.equipment_id||"")===eqId) || (vno && String(r.vehicle_number||"")===vno))
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))[0] || null;
}
function isPatrolComplete(eq){
  const rec=latestPatrolRecordForEquipment(eq);
  if(!rec) return false;
  // 점검한 날과 다음 날까지 '점검완료', 2일이 지나면 다시 '미점검'
  return patrolDateDiffDays(rec.date, todayStr()) < 2;
}
async function completePatrolEquipment(equipmentId){
  const eq=state.equipment.find(x=>Number(x.id)===Number(equipmentId));
  if(!eq) return toast("장비 정보를 찾을 수 없습니다.");
  if(isPatrolComplete(eq)) return toast("이미 점검완료 상태입니다.");

  const all=patrolRecords();
  const record={
    id:Date.now(),
    date:todayStr(),
    equipment_id:Number(eq.id),
    vehicle_number:equipmentDisplayNo(eq),
    checked_at:new Date().toISOString()
  };
  const next=[...all,record];
  const res=await db.from("settings").upsert({key:"patrol_records",value:JSON.stringify(next)});
  if(res.error){console.error(res.error);return toast("순회점검 상태 저장 오류");}
  state.settings.patrol_records=JSON.stringify(next);
  renderPatrol();
  toast(`${equipmentDisplayNo(eq)||"해당 장비"} 점검완료`);

async function cancelLatestPatrolEquipment(equipmentId){

  const next=patrolRecords().filter(r=>String(r.id)!==String(latest.id));

  renderPatrol();

function syncTodayDate(force=false) {
  const now = todayStr();
  if (!force && now === lastKnownToday) return false;
  lastKnownToday = now;

  // 날짜가 넘어가면 오늘 기준 화면들이 어제 날짜에 머물지 않도록 기본 날짜를 오늘로 갱신합니다.
  selectedShiftDate = now;
  patrolPrintDate = now;
  worklogCursorDate = now;
  if (!calendarDetailDate) calendarCursor = new Date();
  activeWorklogDate = "";
  return true;
}

async function handleDateRollover(force=false) {
  const changed = syncTodayDate(force);
  if (!changed) return;
  if (db) {
    await cleanupExpiredTempPhotos();
    await loadAll();
  } else {
    renderCurrent();
  }
}

function startTodayAutoUpdater() {
  setInterval(() => handleDateRollover(false), 60000);

  });
}

function currentMonthKey(){ return todayStr().slice(0,7); }
function isMonthlyRegularEducation(name){ return String(name || "").trim() === "정기안전보건교육"; }
function monthlyRegularDoneRecord(workerId){
  const month = currentMonthKey();
  return state.history.find(h =>
    Number(h.worker_id) === Number(workerId) &&
    h.education_name === "정기안전보건교육" &&
    String(h.education_date || "").slice(0,7) === month

}

function groupedHistoryRows(showManage=true){
  const eduNames = educationTypeNames();
  const latestByWorker={};

  // 교육현황은 기사님 전체를 기준으로 먼저 행을 만들고,
  // 설정의 교육기준 목록을 기준으로 교육 컬럼을 자동 생성합니다.
  // 그래서 아직 이력이 없는 기사님도 교육기준 항목이 빈칸(-)으로 같이 보입니다.
  for(const w of state.workers){
    latestByWorker[String(w.id)] = { worker:w, records:{}, ids:[] };
  }

  for(const h of state.history){
    const key=String(h.worker_id);
    if(!latestByWorker[key]) latestByWorker[key]={worker:null, records:{}, ids:[]};
    const old=latestByWorker[key].records[h.education_name];
    if(!old || String(h.education_date) > String(old.education_date)) latestByWorker[key].records[h.education_name]=h;
    latestByWorker[key].ids.push(h.id);
  }

  const groups=Object.entries(latestByWorker)
    .filter(([workerId,g]) => g.worker)
    .sort((a,b)=>(a[1].worker?.name||"").localeCompare(b[1].worker?.name||""));

  if(!state.workers.length) return `<tr><td colspan="${eduNames.length + (showManage ? 4 : 3)}">등록된 기사님이 없습니다.</td></tr>`;

  return groups.map(([workerId,g], idx)=>{
    const eduCells=eduNames.map(name=>{
      if(isMonthlyRegularEducation(name)){
        const done = monthlyRegularDoneRecord(workerId);
        if(done){
          return `<td><span class="edu-chip">${escapeHtml(done.education_date)}</span><span class="mini"><span class="badge ok">이수</span></span></td>`;
        }
        return `<td><button class="red" onclick="completeMonthlyRegularEducation(${workerId})">미이수</button><span class="mini">${escapeHtml(currentMonthKey())} 기준</span></td>`;
      }
      const r=g.records[name];
      if(!r) return `<td><span class="small">-</span></td>`;
      const cycle=(getEducationRule(name)?.cycle_days ?? 365);
      const sch=calcSchedule(r.education_date, cycle);
      return `<td><span class="edu-chip">${escapeHtml(r.education_date)}</span><span class="mini"><span class="badge ${sch.cls}">${sch.dday}</span></span></td>`;
    }).join("");

async function saveRetentionRule(){
  const name=val("ret-name");
  const years=Number(val("ret-years"));
  const cycle=Number(val("ret-cycle"));
  if(!name) return toast("교육명을 입력하세요.");
  if(Number.isNaN(cycle)) return toast("교육주기(일)는 숫자로 입력하세요. 반복없음은 0입니다.");
  if(Number.isNaN(years) || years < 0) return toast("보관년수는 0 이상의 숫자로 입력하세요.");
  const idxText=val("ret-index");
  const idx=idxText==="" ? -1 : Number(idxText);
  const active=val("ret-active")!=="false";

  const rules=retentionRules().slice();
  const data={education_name:name, retention_years:years, note:val("ret-basis") || val("ret-note"), active};
  const dup=rules.findIndex((r,i)=>i!==idx && r.education_name===name);
  if(dup>=0) return toast("같은 교육명의 보관기준이 이미 있습니다.");
  if(idx>=0) rules[idx]=data; else rules.push(data);
  const ok=await saveRetentionRulesToSettings(rules);
  if(!ok) return;

  const eduRules=educationRules().slice();
  const erIdx=eduRules.findIndex(r=>r.education_name===name);
  const er={education_name:name, category:val("ret-category")||"사용자 지정", cycle_days:cycle, hours:val("ret-hours"), condition:val("ret-condition"), basis:val("ret-basis"), active};
  if(erIdx>=0) eduRules[erIdx]=er; else eduRules.push(er);
  const ok2=await saveRulesToSettings(eduRules);
  if(!ok2) return;
  clearDraftForPage("retention");
  clearRetentionForm(); await loadAll(); toast("보관기준 저장 완료");
}

// =========================
// 영구 사진 저장소 (장비/기사님)
// - 신규 사진: Supabase Storage에 파일로 저장
// - 기존 Base64 사진: 최초 실행 시 Storage로 자동 이전 후 settings에서 Base64 제거
// =========================
function isBase64Photo(src){ return typeof src === "string" && src.startsWith("data:image/"); }
function photoUrl(photo){
  if(!photo) return "";
  if(photo.storage_path){
    return photoDb.storage.from(PERMANENT_PHOTO_BUCKET).getPublicUrl(photo.storage_path).data?.publicUrl || "";
  }
  return photo.src || ""; // 마이그레이션 전 기존 사진 호환
}
function safeFilePart(v){ return String(v||"photo").replace(/[^a-zA-Z0-9._-]/g,"_").slice(0,80); }
function extFromMime(type){ const m=String(type||"").match(/image\/(jpeg|jpg|png|webp|gif)/i); return m ? (m[1].toLowerCase()==="jpeg"?"jpg":m[1].toLowerCase()) : "jpg"; }
async function dataUrlToBlob(dataUrl){ return await (await fetch(dataUrl)).blob(); }
async function uploadPermanentPhoto(fileOrBlob, group, ownerId, originalName="photo.jpg"){
  const type=fileOrBlob.type || "image/jpeg";
  const ext=extFromMime(type);
  const path=`${group}/${ownerId}/${Date.now()}_${Math.random().toString(36).slice(2,9)}_${safeFilePart(originalName).replace(/\.[^.]+$/,"")}.${ext}`;
  const {error}=await photoDb.storage.from(PERMANENT_PHOTO_BUCKET).upload(path,fileOrBlob,{contentType:type,upsert:false,cacheControl:"3600"});
  if(error) throw error;
  return path;
}
async function deletePermanentPhotoFile(photo){
  if(!photo?.storage_path) return;
  const {error}=await photoDb.storage.from(PERMANENT_PHOTO_BUCKET).remove([photo.storage_path]);
  if(error) console.warn("Storage 사진 삭제 실패",error);
}
async function migrateLegacyPermanentPhotos(){
  if(!db || state.settings.permanent_photo_migration_v1 === "done") return;
  let workerMap=workerDetails();
  let equipmentMap=equipmentDetails();
  let changedW=false, changedE=false, migrated=0;
  try{
    for(const [ownerId,d] of Object.entries(workerMap)){
      for(const photo of (Array.isArray(d.photos)?d.photos:[])){
        if(!isBase64Photo(photo.src)) continue;
        const blob=await dataUrlToBlob(photo.src);
        photo.storage_path=await uploadPermanentPhoto(blob,"workers",ownerId,`legacy_${migrated}.jpg`);
        delete photo.src; changedW=true; migrated++;
      }
    }
    for(const [ownerId,d] of Object.entries(equipmentMap)){
      for(const photo of (Array.isArray(d.photos)?d.photos:[])){
        if(!isBase64Photo(photo.src)) continue;
        const blob=await dataUrlToBlob(photo.src);
        photo.storage_path=await uploadPermanentPhoto(blob,"equipment",ownerId,`legacy_${migrated}.jpg`);
        delete photo.src; changedE=true; migrated++;
      }
    }
    if(changedW && !await saveWorkerDetailsMap(workerMap)) throw new Error("기사님 사진정보 저장 실패");
    if(changedE && !await saveEquipmentDetailsMap(equipmentMap)) throw new Error("장비 사진정보 저장 실패");
    const r=await db.from("settings").upsert({key:"permanent_photo_migration_v1",value:"done"});
    if(r.error) throw r.error;
    state.settings.permanent_photo_migration_v1="done";
    if(migrated) toast(`기존 사진 ${migrated}장 저장 최적화 완료`);
  }catch(e){
    console.error("기존 사진 Storage 이전 실패",e);
    // 버킷/정책이 아직 없으면 기존 Base64는 그대로 보존하므로 사진이 사라지지 않습니다.
    toast("영구사진 저장소 설정을 확인하세요.");
  }
}

  setVal("eq-id",e.id); setVal("eq-type",e.vehicle_type); setVal("eq-work",e.work_type); setVal("eq-number",e.vehicle_number);
  document.getElementById("equipment-form-card")?.scrollIntoView({behavior:"smooth", block:"start"});
}
function hideEquipmentForm(){ document.getElementById("equipment-form-card")?.classList.add("hidden"); clearEqForm(); }
function clearEqForm(){ ["eq-id","eq-type","eq-work","eq-number"].forEach(x=>setVal(x,"")); clearDraftForPage("equipment"); }
async function deleteEquipment(id){
  if(!confirm("장비를 삭제할까요? 장비에 저장된 메모와 사진도 함께 삭제됩니다."))return;
  const res=await db.from("equipment").delete().eq("id",id);
  if(res.error) return toast("삭제 오류");

function workJournal(){
  try {
    const parsed = JSON.parse(state.settings.work_journal || "{}");
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch(e) { return {}; }
}
let activeWorklogDate = "";
function dayNameKo(dateText){
  const names = ["일","월","화","수","목","금","토"];
  const d = new Date(dateText + "T00:00:00");
  return names[d.getDay()] || "";
}
function shortDateWithDay(dateText){
  const d = new Date(dateText + "T00:00:00");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${mm}.${dd}(${dayNameKo(dateText)})`;
}
function mondayOfWeek(dateText){
  const d = new Date((dateText || todayStr()) + "T00:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return formatDate(d);
}
function worklogVisibleDates(){
  if(isMobileView()) return [worklogCursorDate || todayStr()];
  const mon = mondayOfWeek(worklogCursorDate || todayStr());
  return Array.from({length:5}, (_, i) => addDaysText(mon, i));
}
function moveWorklogWeek(offset){
  worklogCursorDate = addDaysText(worklogCursorDate || todayStr(), Number(offset) * 7);
  activeWorklogDate = "";
  renderWorklog();
}
function moveWorklogDay(offset){
  worklogCursorDate = addDaysText(worklogCursorDate || todayStr(), Number(offset));
  activeWorklogDate = "";
  renderWorklog();
}
function goWorklogToday(){
  worklogCursorDate = todayStr();
  activeWorklogDate = "";
  renderWorklog();
}
function openWorklogModal(dateText){
  activeWorklogDate = dateText;
  renderWorklog();
}
function closeWorklogModal(){
  activeWorklogDate = "";
  renderWorklog();
}
function worklogDisplayText(v){
  const text = String(v || "").trim();
  return text ? escapeHtml(text).replace(/\n/g, "<br>") : `<span class="small">미작성</span>`;
}
function worklogDayCard(dateText){
  const journal = workJournal();
  const item = journal[dateText] || {};
  const updated = item.updated_at ? `<div class="small">최종 수정: ${escapeHtml(item.updated_at.slice(0,16).replace("T"," "))}</div>` : `<div class="small">미작성</div>`;
  return `<div class="worklog-day-card">
    <button class="worklog-date-head" onclick="openWorklogModal('${dateText}')" title="클릭해서 업무일지 수정">${shortDateWithDay(dateText)}</button>
    <div class="worklog-block">
      <label>금일 업무</label>
      <div class="worklog-display">${worklogDisplayText(item.today_work)}</div>
    </div>
    <div class="worklog-block">
      <label>업무 결과</label>
      <div class="worklog-display">${worklogDisplayText(item.result_work)}</div>
    </div>
    <div class="worklog-card-actions">${updated}</div>
  </div>`;
}
function worklogModalHtml(){
  if(!activeWorklogDate) return "";
  const journal = workJournal();
  const item = journal[activeWorklogDate] || {};
  return `<div class="modal-backdrop">
    <div class="modal">
      <div class="modal-title">${shortDateWithDay(activeWorklogDate)} 업무일지 수정</div>
      <p class="small">금일 업무와 업무 결과를 입력한 뒤 저장하세요.</p>
      <div style="margin-top:10px">
        <label>금일 업무</label>
        <textarea id="worklog-modal-today" placeholder="오늘 진행한 업무 내용을 입력하세요.">${escapeHtml(item.today_work || "")}</textarea>
      </div>
      <div style="margin-top:10px">
        <label>업무 결과</label>
        <textarea id="worklog-modal-result" placeholder="업무 결과, 조치사항, 특이사항을 입력하세요.">${escapeHtml(item.result_work || "")}</textarea>
      </div>
      <div class="actions">
        <button class="primary" onclick="saveWorklogModal()">저장</button>
        <button onclick="closeWorklogModal()">닫기</button>
      </div>
    </div>
  </div>`;
}
function renderWorklog(){
  const mobile = isMobileView();
  const dates = worklogVisibleDates();
  const weekStart = mondayOfWeek(worklogCursorDate || todayStr());
  const weekEnd = addDaysText(weekStart, 4);
  const title = mobile ? `${shortDateWithDay(worklogCursorDate || todayStr())} 업무일지` : `${shortDateWithDay(weekStart)} ~ ${shortDateWithDay(weekEnd)} 업무일지`;
  const leftBtn = mobile
    ? `<button onclick="moveWorklogDay(-1)">◀</button>`
    : `<button onclick="moveWorklogWeek(-1)">이전주</button>`;
  const rightBtn = mobile
    ? `<button onclick="moveWorklogDay(1)">▶</button>`
    : `<button onclick="moveWorklogWeek(1)">다음주</button>`;
  document.getElementById("page-worklog").innerHTML = `
    <div class="card">
      <div class="worklog-toolbar">
        ${leftBtn}
        <h2 style="margin:0">${title}</h2>
        ${rightBtn}
      </div>
      <div class="actions">
        <button onclick="goWorklogToday()">오늘로 이동</button>
        <button onclick="loadAll()">새로고침</button>
      </div>
      <p class="small">날짜 칸을 클릭하면 업무일지 수정 창이 열립니다. PC에서는 월~금 5일치가 한 번에 보이고, 모바일에서는 ◀ / ▶ 버튼으로 하루씩 이동합니다.</p>
    </div>
    <div class="worklog-week-grid">${dates.map(worklogDayCard).join("")}</div>
    ${worklogModalHtml()}`;
}
async function saveWorklogModal(){
  if(!activeWorklogDate) return toast("수정할 날짜를 찾을 수 없습니다.");
  const journal = workJournal();
  journal[activeWorklogDate] = {
    today_work: val("worklog-modal-today"),
    result_work: val("worklog-modal-result"),
    updated_at: new Date().toISOString()
  };
  const res = await db.from("settings").upsert({key:"work_journal", value:JSON.stringify(journal)});
  if(res.error){ console.error(res.error); return toast("업무일지 저장 오류"); }
  state.settings.work_journal = JSON.stringify(journal);
  activeWorklogDate = "";
  toast("업무일지 저장 완료");
  renderWorklog();
}

function memoFiles(){
  try {
    const parsed = JSON.parse(state.settings.memo_files || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch(e) { return []; }
}
function memoById(id){ return memoFiles().find(x => String(x.id) === String(id)) || null; }
function openNewMemo(){
  activeMemoId = null;
  memoEditorOpen = true;
  renderMemo();
  setTimeout(() => document.getElementById("memo-title")?.focus(), 0);
}
function openMemoFile(id){
  activeMemoId = id;
  memoEditorOpen = true;
  renderMemo();
}
function closeMemoEditor(){
  activeMemoId = null;
  memoEditorOpen = false;
  renderMemo();
}
function renderMemo(){
  const files = memoFiles().slice().sort((a,b) => String(b.created_at || b.updated_at || "").localeCompare(String(a.created_at || a.updated_at || "")));
  const listHtml = files.length ? files.map(m => `
    <div class="memo-file">
      <div class="memo-file-icon">📝</div>
      <div style="min-width:0">
        <button class="memo-file-title" onclick="openMemoFile('${String(m.id).replaceAll("'","\\'")}')">${escapeHtml(m.title || "제목 없는 메모")}</button>
        <div class="memo-file-date">메모 날짜: ${escapeHtml(m.created_date || "-")}${m.updated_at ? ` · 마지막 수정: ${escapeHtml(String(m.updated_at).slice(0,10))}` : ""}</div>
      </div>
      <button class="red" onclick="deleteMemoFile('${String(m.id).replaceAll("'","\\'")}')">삭제</button>
    </div>`).join("") : `<div class="mobile-card"><p class="small">저장된 메모가 없습니다. 위의 추가 버튼을 눌러 새 메모를 작성하세요.</p></div>`;

  const current = activeMemoId !== null ? memoById(activeMemoId) : null;
  const editorHtml = memoEditorOpen ? `
    <div class="memo-editor">
      <h2>${current ? "메모 열기/수정" : "새 메모 작성"}</h2>
      <div class="form-row" style="grid-template-columns:2fr 1fr">
        <div><label>메모 제목</label><input id="memo-title" value="${escapeHtml(current?.title || "")}" placeholder="메모 제목을 입력하세요"></div>
        <div><label>메모 날짜</label><input id="memo-created-date" value="${escapeHtml(current?.created_date || todayStr())}" readonly></div>
      </div>
      <div><label>메모 내용</label><textarea id="memo-content" placeholder="내용을 입력하세요.">${escapeHtml(current?.content || "")}</textarea></div>
      <div class="actions">
        <button class="primary" onclick="saveMemoFile()">저장</button>
        ${current ? `<button class="red" onclick="deleteMemoFile('${String(current.id).replaceAll("'","\\'")}')">삭제</button>` : ""}
        <button onclick="closeMemoEditor()">닫기</button>
      </div>
    </div>` : "";

  document.getElementById("page-memo").innerHTML = `
    <div class="card">
      <div class="memo-toolbar">
        <div><h2 style="margin-bottom:4px">메모</h2><p class="small" style="margin:0">메모를 파일처럼 각각 저장하고 제목을 눌러 열람·수정할 수 있습니다.</p></div>
        <button class="primary" onclick="openNewMemo()">+ 추가</button>
      </div>
      <div class="memo-file-list">${listHtml}</div>
      ${editorHtml}
    </div>`;
}
async function saveMemoFile(){
  const title = val("memo-title").trim() || "제목 없는 메모";
  const content = val("memo-content");
  const createdDate = val("memo-created-date") || todayStr();
  if(!content.trim()) return toast("메모 내용을 입력하세요.");
  const all = memoFiles();
  const old = activeMemoId !== null ? all.find(x => String(x.id) === String(activeMemoId)) : null;
  const now = new Date().toISOString();
  const record = {
    id: old?.id || Date.now(),
    title,
    content,
    created_date: old?.created_date || createdDate,
    created_at: old?.created_at || now,
    updated_at: now
  };
  const next = old ? all.map(x => String(x.id) === String(old.id) ? record : x) : [record, ...all];
  const res = await db.from("settings").upsert({key:"memo_files", value:JSON.stringify(next)});
  if(res.error){ console.error(res.error); return toast("메모 저장 오류"); }
  state.settings.memo_files = JSON.stringify(next);
  activeMemoId = record.id;
  memoEditorOpen = true;
  renderMemo();
  toast(old ? "메모 수정 완료" : "메모 저장 완료");
}
async function deleteMemoFile(id){
  const memo = memoById(id);
  if(!memo) return toast("삭제할 메모를 찾을 수 없습니다.");
  if(!confirm(`'${memo.title || "제목 없는 메모"}' 메모를 삭제할까요?`)) return;
  const next = memoFiles().filter(x => String(x.id) !== String(id));
  const res = await db.from("settings").upsert({key:"memo_files", value:JSON.stringify(next)});
  if(res.error){ console.error(res.error); return toast("메모 삭제 오류"); }
  state.settings.memo_files = JSON.stringify(next);
  if(String(activeMemoId) === String(id)){ activeMemoId = null; memoEditorOpen = false; }
  renderMemo();
  toast("메모 삭제 완료");
}

function renderSettings(){
  const rules = educationRules();
  const ruleRows = rules.map((r, idx)=>`<tr>
    <td>${escapeHtml(r.education_name)}</td>
    <td>${Number(r.cycle_days)===0?"반복없음":escapeHtml(r.cycle_days)+"일"}</td>
    <td>${escapeHtml(r.category)}</td>
    <td>${escapeHtml(r.hours)}</td>
    <td>${escapeHtml(r.condition)}</td>
    <td class="left">${escapeHtml(r.basis)}</td>
    <td>${r.active===false?"미사용":"사용"}</td>
    <td><button onclick="editRule(${idx})">수정</button> <button class="red" onclick="deleteRule(${idx})">삭제</button></td>
  </tr>`).join("") || `<tr><td colspan="8">등록된 교육기준이 없습니다.</td></tr>`;
  document.getElementById("page-settings").innerHTML=`
    <div class="card"><h2>문자 기본문구</h2><p class="small">치환값: {name}, {education}, {next_date}, {dday}, {phone}</p><textarea id="sms-template">${escapeHtml(state.settings.sms_template||DEFAULT_TEMPLATE)}</textarea><div class="actions"><button class="primary" onclick="saveSettings()">문구 저장</button></div></div>

    <div class="card"><h2>교육기준 등록/수정</h2>
      <input type="hidden" id="rule-index">
      <div class="form-row">
        <div><label>교육명</label><input id="rule-name" placeholder="예: 출입교육"></div>
        <div><label>구분</label><input id="rule-category" placeholder="예: 반복 / 1회성 / 조건부"></div>
        <div><label>주기(일)</label><input id="rule-cycle" placeholder="365, 90, 0"></div>
        <div><label>사용 여부</label><select id="rule-active"><option value="true">사용</option><option value="false">미사용</option></select></div>
      </div>
      <div class="form-row">
        <div><label>시간/조건</label><input id="rule-hours" placeholder="예: 분기 6시간, 최초 1회"></div>
        <div><label>대상/조건</label><input id="rule-condition" placeholder="예: 신규 투입자, MSDS 대상물질 취급자"></div>
        <div style="grid-column:span 2"><label>관리근거</label><input id="rule-basis" placeholder="예: 산업안전보건법 시행규칙, 사업장 출입 기준 등"></div>
      </div>
      <p class="small">여기서 저장한 기준은 교육주기 등록, 기본교육 자동생성, 교육현황 카드의 교육명 목록에 바로 반영됩니다. 주기 0일은 반복 없는 1회성/조건부 교육으로 처리됩니다.</p>
      <div class="actions"><button class="primary" onclick="saveRule()">교육기준 저장</button><button onclick="clearRuleForm()">초기화</button><button onclick="resetDefaultRules()">기본값 복원</button></div>
    </div>

    <div class="card"><h2>교육기준 목록</h2>
      <div class="table-wrap"><table><thead><tr><th>교육명</th><th>주기</th><th>구분</th><th>시간/조건</th><th>대상/조건</th><th>관리근거</th><th>사용</th><th>관리</th></tr></thead><tbody>${ruleRows}</tbody></table></div>
    </div>
    <div class="card"><h2>앱 설치 안내</h2><p>휴대폰 Chrome에서 이 페이지 접속 후 <b>⋮ → 홈 화면에 추가</b>를 누르면 앱처럼 사용할 수 있습니다.</p></div>`;
}

async function saveRulesToSettings(rules){
  const res = await db.from("settings").upsert({key:"education_rules", value:JSON.stringify(rules)});
  if(res.error){ toast("교육기준 저장 오류"); return false; }
  state.settings.education_rules = JSON.stringify(rules);
  return true;
}

async function saveRule(){
  const name = val("rule-name");
  const cycle = Number(val("rule-cycle"));
  if(!name) return toast("교육명을 입력하세요.");
  if(Number.isNaN(cycle)) return toast("주기(일)는 숫자로 입력하세요. 반복없음은 0입니다.");
  const idxText = val("rule-index");
  const idx = idxText === "" ? -1 : Number(idxText);
  const rules = educationRules().slice();
  const data = {
    education_name:name,
    category:val("rule-category") || "사용자 지정",
    cycle_days:cycle,
    hours:val("rule-hours"),
    condition:val("rule-condition"),
    basis:val("rule-basis"),
    active:val("rule-active") !== "false"
  };
  const dup = rules.findIndex((r,i)=>i!==idx && r.education_name===name);
  if(dup >= 0) return toast("같은 교육명이 이미 있습니다.");
  if(idx >= 0) rules[idx] = data; else rules.push(data);
  const ok = await saveRulesToSettings(rules);
  if(!ok) return;
  clearDraftForPage("settings");
  clearRuleForm();
  await loadAll();
  toast("교육기준 저장 완료");
}

function editRule(idx){
  const r = educationRules()[idx];
  if(!r) return;
  setVal("rule-index", idx);
  setVal("rule-name", r.education_name);
  setVal("rule-category", r.category);
  setVal("rule-cycle", r.cycle_days);
  setVal("rule-hours", r.hours);
  setVal("rule-condition", r.condition);
  setVal("rule-basis", r.basis);
  setVal("rule-active", r.active===false?"false":"true");
  scrollTo(0,0);
}
function clearRuleForm(){ ["rule-index","rule-name","rule-category","rule-cycle","rule-hours","rule-condition","rule-basis"].forEach(x=>setVal(x,"")); setVal("rule-active","true"); clearDraftForPage("settings"); }
async function deleteRule(idx){
  const rules = educationRules().slice();
  const r = rules[idx];
  if(!r) return;
  if(!confirm(`${r.education_name} 교육기준을 삭제할까요? 기존 교육이력은 삭제되지 않습니다.`)) return;
  rules.splice(idx,1);
  const ok = await saveRulesToSettings(rules);
  if(!ok) return;
  await loadAll();
  toast("교육기준 삭제 완료");
}
async function resetDefaultRules(){
  if(!confirm("교육기준을 기본값으로 복원할까요? 현재 수정한 기준표는 덮어쓰기 됩니다.")) return;
  const ok = await saveRulesToSettings(DEFAULT_EDUCATION_RULES);
  if(!ok) return;
  await loadAll();
  toast("기본 교육기준 복원 완료");
}

async function saveSettings(){ const value=val("sms-template"); const res=await db.from("settings").upsert({key:"sms_template", value}); if(res.error)return toast("저장 오류"); clearDraftForPage("settings"); await loadAll(); toast("저장 완료"); }

function draftPrefix(page=currentPage){ return `educationSystemDraft:${page}:`; }
function draftEnabledPage(page=currentPage){ return !["mobile","dashboard"].includes(page); }
function saveDraftForPage(page=currentPage){
  if(!draftEnabledPage(page)) return;
  document.querySelectorAll(`#page-${page} input, #page-${page} select, #page-${page} textarea`).forEach(el=>{
    if(!el.id) return;
    localStorage.setItem(draftPrefix(page)+el.id, el.value ?? "");
  });
}
function restoreDraftForPage(page=currentPage){
  if(!draftEnabledPage(page)) return;
  document.querySelectorAll(`#page-${page} input, #page-${page} select, #page-${page} textarea`).forEach(el=>{
    if(!el.id) return;
    const key=draftPrefix(page)+el.id;
    const saved=localStorage.getItem(key);
    if(saved!==null && saved!=="") el.value=saved;
  });
}
function clearDraftForPage(page=currentPage){
  const prefix=draftPrefix(page);
  Object.keys(localStorage).filter(k=>k.startsWith(prefix)).forEach(k=>localStorage.removeItem(k));
}
function bindDraftInputs(){
  if(!draftEnabledPage(currentPage)) return;
  restoreDraftForPage(currentPage);
  document.querySelectorAll(`#page-${currentPage} input, #page-${currentPage} select, #page-${currentPage} textarea`).forEach(el=>{
    if(!el.id || el.dataset.draftBound==="1") return;
    el.dataset.draftBound="1";
    el.addEventListener("input",()=>saveDraftForPage(currentPage));
    el.addEventListener("change",()=>saveDraftForPage(currentPage));
  });
}

function val(id){ return document.getElementById(id)?.value?.trim() ?? ""; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v ?? ""; }

window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

window.addEventListener("load", async () => {
  if (!ready()) return;
  syncTodayDate(true);
  startTodayAutoUpdater();
  await loadAll();
  await migrateLegacyPermanentPhotos();
  showPage("mobile");
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service Worker registered"))
      .catch(err => console.warn("Service Worker registration failed", err));
  });
}
